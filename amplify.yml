# Amplify build settings for texasbusiness.news.
#
# This file takes precedence over the build settings stored in the Amplify
# console, so the build phases below reproduce that configuration exactly. The
# reason it lives in the repository is customHeaders: the security headers a
# public, ad-supported site needs belong in version control next to the code
# whose behaviour they constrain.
#
# The SPA rewrite (/<*> -> /index.html, 404-200) remains a console redirect
# rule; amplify.yml cannot express redirects.
version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci --cache .npm --prefer-offline
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - .npm/**/*
# IMPORTANT: this customHeaders block is NOT what production serves.
#
# The Amplify app has a buildSpec stored in the console, and a stored buildSpec
# takes precedence over this file -- which is why these headers did not apply on
# the first deploy even though the build succeeded. The console buildSpec cannot
# be cleared through the CLI either (update-app rejects an empty --build-spec).
#
# The live headers are set on the app's own customHeaders field:
#
#   aws amplify update-app --app-id d3ovdx20nkkza2 \
#     --custom-headers "$(sed -n '/^customHeaders:/,$p' amplify.yml | grep -v '^\s*#')" \
#     --region us-west-2 --profile dharma
#
# Keep this block as the source of truth and re-run that command after editing,
# or the file and production will drift apart. Pass ONLY --custom-headers:
# update-app replaces the whole environment-variable map if you pass that too.
customHeaders:
  - pattern: '**'
    headers:
      # The site loads no third-party script of its own. The two exceptions are
      # the LiveCoinWatch and TradingView ticker widgets; naming them here means
      # anything else is blocked outright rather than silently permitted.
      #
      # TradingView serves its script from s3.tradingview.com but renders into an
      # iframe on tradingview-widget.com, and that iframe calls a sheriff
      # subdomain. Both are needed or the market ticker silently fails to draw --
      # confirmed against production, not assumed. LiveCoinWatch likewise pulls
      # its prices from http-api.livecoinwatch.com, which is not the api.
      # subdomain its docs mention. Both vendors were found by watching what
      # production actually blocked, including the coin icons LiveCoinWatch
      # serves from a DigitalOcean Spaces bucket.
      - key: Content-Security-Policy
        value: >-
          default-src 'self';
          base-uri 'self';
          object-src 'none';
          frame-ancestors 'none';
          form-action 'self';
          script-src 'self' https://s3.tradingview.com https://www.livecoinwatch.com;
          style-src 'self' 'unsafe-inline';
          img-src 'self' data: https://www.livecoinwatch.com https://s3.tradingview.com
          https://lcw.nyc3.cdn.digitaloceanspaces.com;
          font-src 'self' data:;
          connect-src 'self' https://ql3mj2hit5lv7p4bb7cm2unxoy0kopsi.lambda-url.us-west-2.on.aws
          https://api.emailjs.com https://api.livecoinwatch.com https://www.livecoinwatch.com
          https://http-api.livecoinwatch.com https://*.tradingview-widget.com;
          frame-src https://s.tradingview.com https://www.tradingview.com
          https://www.tradingview-widget.com https://*.tradingview-widget.com
          https://www.livecoinwatch.com;
          upgrade-insecure-requests
      - key: Strict-Transport-Security
        value: 'max-age=63072000; includeSubDomains; preload'
      # A site that carries advertising must not be framable: it is what makes
      # clickjacking a placement possible.
      - key: X-Frame-Options
        value: DENY
      - key: X-Content-Type-Options
        value: nosniff
      - key: Referrer-Policy
        value: strict-origin-when-cross-origin
      - key: Permissions-Policy
        value: 'accelerometer=(), camera=(), geolocation=(), gyroscope=(), interest-cohort=(), magnetometer=(), microphone=(), payment=(), usb=()'
      - key: Cross-Origin-Opener-Policy
        value: same-origin
      - key: X-Permitted-Cross-Domain-Policies
        value: none
